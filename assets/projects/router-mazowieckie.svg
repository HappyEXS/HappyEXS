<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- PLACEHOLDER: podmień na zrzut ekranu mapy z wyznaczoną trasą.
       Motyw: graf drogowy z najkrótszą ścieżką. -->
  <defs>
    <pattern id="g4" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#7A848C" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#g4)"/>

  <!-- graf drogowy -->
  <g stroke="#7A848C" stroke-opacity=".45" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M160 520 300 470 300 300 190 210"/>
    <path d="M300 470 470 545 660 500 780 560 1030 495"/>
    <path d="M300 300 500 250 700 320 900 250 1050 300"/>
    <path d="M470 545 500 380 700 320"/>
    <path d="M500 250 470 130 720 110 900 250"/>
    <path d="M660 500 700 320"/>
    <path d="M780 560 900 420 1050 300"/>
    <path d="M500 380 340 390"/>
    <path d="M900 420 900 250"/>
    <path d="M190 210 470 130"/>
  </g>

  <!-- wyznaczona trasa -->
  <path d="M160 520 300 470 500 380 700 320 900 250 1050 300"
        fill="none" stroke="#17A398" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- węzły -->
  <g fill="#7A848C" fill-opacity=".7">
    <circle cx="190" cy="210" r="6"/><circle cx="300" cy="300" r="6"/>
    <circle cx="470" cy="545" r="6"/><circle cx="660" cy="500" r="6"/>
    <circle cx="780" cy="560" r="6"/><circle cx="1030" cy="495" r="6"/>
    <circle cx="470" cy="130" r="6"/><circle cx="720" cy="110" r="6"/>
    <circle cx="900" cy="420" r="6"/><circle cx="340" cy="390" r="6"/>
    <circle cx="500" cy="250" r="6"/>
  </g>
  <g fill="#17A398">
    <circle cx="300" cy="470" r="7"/><circle cx="500" cy="380" r="7"/>
    <circle cx="700" cy="320" r="7"/><circle cx="900" cy="250" r="7"/>
  </g>

  <!-- punkt startowy i docelowy -->
  <circle cx="160" cy="520" r="14" fill="none" stroke="#17A398" stroke-width="4"/>
  <circle cx="1050" cy="300" r="14" fill="#17A398"/>

  <g font-family="ui-monospace, Consolas, monospace" font-size="26" fill="#7A848C">
    <text x="120" y="632">najkrótsza trasa w grafie drogowym</text>
  </g>
</svg>
